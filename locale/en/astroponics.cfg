[mod-setting-description]
astroponics-crude-oil=Mix excess bioslurry with pollutants to convert it into crude oil.
astroponics-gleba-crops=We have Gleba in space.
astroponics-more-gleba=Doubles the yield of Astroponics for [item=yumako] Yumako and [item=jellynut] per craft from 20 to 40. By default, Glebaponics is a net negative loop without late-game productivity. This changes the loop to be net-positive after taking Biochamber productivity into account.
astroponics-garden-speed=Change the crafting speed of the Space garden, for adjusting balance relative to other mods (default value: 1)
astroponics-more-wood=Increase the amount of wood yielded by Tree astroponics from 4 to 10. This reflects the adjusted balance when Early Agriculture is installed (in which case this setting is hidden), though may not be balanced relative to other mods.
